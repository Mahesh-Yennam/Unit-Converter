<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="scaleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Center Balance Beam / Scale Pole -->
  <rect x="30" y="14" width="4" height="36" rx="2" fill="#64748b" />
  <rect x="22" y="48" width="20" height="4" rx="2" fill="#64748b" />

  <!-- Balance Fulcrum Triangle -->
  <polygon points="32,18 28,24 36,24" fill="#f59e0b" filter="url(#glow)" />

  <!-- Crossbar -->
  <line x1="12" y1="21" x2="52" y2="21" stroke="url(#scaleGrad)" stroke-width="3" stroke-linecap="round" filter="url(#glow)" />

  <!-- Left Scale Pan -->
  <line x1="16" y1="22" x2="12" y2="34" stroke="#94a3b8" stroke-width="1.5" />
  <line x1="16" y1="22" x2="20" y2="34" stroke="#94a3b8" stroke-width="1.5" />
  <path d="M10 34 C10 40 22 40 22 34 Z" fill="#f59e0b" opacity="0.9" filter="url(#glow)" />

  <!-- Right Scale Pan -->
  <line x1="48" y1="22" x2="44" y2="34" stroke="#94a3b8" stroke-width="1.5" />
  <line x1="48" y1="22" x2="52" y2="34" stroke="#94a3b8" stroke-width="1.5" />
  <path d="M42 34 C42 40 54 40 54 34 Z" fill="#06b6d4" opacity="0.9" filter="url(#glow)" />

  <!-- Measurement Tick Accent -->
  <circle cx="32" cy="14" r="3" fill="#ffffff" />
</svg>
